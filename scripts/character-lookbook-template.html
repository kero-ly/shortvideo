<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角色挑选画册</title>
<style>:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#433c45;background:#faf6f1}*{box-sizing:border-box}body{margin:0}header{padding:40px 5vw 24px;background:#efe2dc}h1{font-size:clamp(28px,4vw,44px);margin:10px 0}p{line-height:1.8;max-width:880px}.eyebrow{font-size:12px;letter-spacing:3px;color:#8b5965}.note{color:#786b71;font-size:14px}.toolbar{position:sticky;top:0;z-index:2;display:flex;gap:10px;flex-wrap:wrap;padding:16px 5vw;background:#faf6f1f5;border-bottom:1px solid #e9ded7}input,select,button,a.btn{font:inherit;border:1px solid #dfcec7;border-radius:10px;background:white;color:#433c45;padding:10px 14px}input{flex:1;min-width:180px}button,a.btn{cursor:pointer}button:hover,a.btn:hover{background:#f7e7e7}main{padding:24px 5vw 50px}.count{color:#88777e;margin-bottom:20px;font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:22px}article{background:#fff;border:1px solid #e9ded7;border-radius:18px;overflow:hidden;box-shadow:0 8px 24px #52374408}.picture{display:block;width:100%;padding:0;border:0;border-radius:0;background:#f1eeea;cursor:zoom-in;height:300px}.picture img{width:100%;height:100%;object-fit:contain}.body{padding:18px}.tag{font-size:12px;color:#966471}h2{font-size:18px;margin:9px 0}.name{overflow-wrap:anywhere;color:#83727a;font-size:12px}.status{display:inline-block;padding:6px 8px;background:#f5ece7;border-radius:6px;font-size:12px;margin:12px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button,.actions a{font-size:12px;text-decoration:none}dialog{border:0;border-radius:18px;padding:18px;max-width:94vw;background:#faf6f1}dialog::backdrop{background:#302632cc}dialog img{display:block;max-width:85vw;max-height:76vh;object-fit:contain}dialog .actions{margin-top:12px;align-items:center}footer{padding:20px 5vw;color:#88777e;font-size:13px}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#453443;color:white;border-radius:12px;padding:12px 20px;z-index:5;display:none}</style>
<header><div class="eyebrow">SHORTVIDEO / CHARACTER LOOKBOOK</div><h1>下一条故事，谁来出场？</h1><p>历史角色母版与设计页 · 按项目挑选，保留每次尝试</p><p class="note">点击图片放大，复制角色编号后告诉我“沿用 C001 的形象，换成……”。已确认与历史候选分别标注；选择角色不会自动继承原视频的声音、剧情或音乐。图片仍保存在原项目目录。</p></header>
<div class="toolbar"><input id="query" aria-label="搜索角色" placeholder="搜索：妈妈、夫妻、宝宝、项目或版本…"><select id="category" aria-label="角色类型"><option value="">全部角色</option><option>母婴</option><option>科普角色</option></select><select id="status" aria-label="确认状态"><option value="">全部状态</option><option value="confirmed">已确认 / 指定沿用</option><option value="candidate">历史候选</option></select></div>
<main><div id="count" class="count"></div><div class="grid" id="grid"></div></main><footer>v1 · 2026-10-28 · 仅展示本地已找到的角色文件，尚未核验全部历史版本。<a href="character-lookbook-v1.json">来源与 SHA256 索引</a></footer><dialog id="viewer"><img id="large" alt="角色大图"><div class="actions"><strong id="caption"></strong><button id="close">关闭</button></div></dialog><div id="toast" role="status"></div>
<script>const items=__DATA__;const $=s=>document.querySelector(s);const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const url=p=>'../'+p.split('/').map(encodeURIComponent).join('/');
function render(){const q=$('#query').value.toLowerCase(),cat=$('#category').value,st=$('#status').value;const filtered=items.filter(x=>(!q||[x.name,x.group,x.role,x.id,x.episode].join(' ').toLowerCase().includes(q))&&(!cat||x.category===cat)&&(!st||(st==='candidate')===x.status.includes('未核对')));$('#count').textContent=`${filtered.length} / ${items.length} 张 · ${new Set(filtered.map(x=>x.episode)).size} 个项目`;$('#grid').innerHTML=filtered.map(x=>`<article><button class="picture" data-view="${x.id}" aria-label="放大 ${esc(x.group+' '+x.name)}"><img loading="lazy" src="${url(x.path)}" alt="${esc(x.group+' '+x.name)}"></button><div class="body"><span class="tag">${x.id} · ${esc(x.role)}</span><h2>${esc(x.group)}</h2><div class="name">${esc(x.name)}</div><div class="status">${esc(x.status)}</div><div class="actions"><button data-copy="${x.id}">复制选用信息</button><a class="btn" href="${url(x.path)}" target="_blank" rel="noopener">打开原图</a></div></div></article>`).join('')||'<p>没有找到，试试其他关键词。</p>'}
for(const s of ['#query','#category','#status'])$(s).addEventListener('input',render);$('#grid').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.view||b.dataset.copy,x=items.find(i=>i.id===id);if(b.dataset.view){$('#large').src=url(x.path);$('#caption').textContent=x.id+' · '+x.group+' · '+x.name;$('#viewer').showModal()}else{const t=`选用角色 ${x.id}：${x.group} / ${x.name}；原图：${x.path}；SHA256：${x.sha256}`;try{await navigator.clipboard.writeText(t);$('#toast').textContent='已复制角色选用信息';$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2200)}catch{prompt('复制这段角色选用信息',t)}}});$('#close').onclick=()=>$('#viewer').close();render();</script></html>
